<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Free Explorers</title>
    <meta name="description" content="Free Explorers is an Open Collective funding and building open-source projects like Veshell." />
    <!-- Each page's canonical, link previews and structured data: written by scripts/prerender.mjs -->
    <!--seo-->
    <meta name="theme-color" content="#1d3a4c" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <!-- With JavaScript, the prerendered page stays hidden: the app replaces it at once -->
    <script>document.documentElement.classList.add("js");</script>
    <style>.js .static-page{display:none}</style>
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
